[build]
  command = "node scripts/decode-assets.js && node scripts/patch-google-reviews.js && node scripts/patch-ai-search.js"
  publish = "."

[functions]
  directory = "netlify/functions"

# Submit sitemap URLs to IndexNow after a production deploy is live.
# Deploy previews and branch deploys do not run this plugin.
[[context.production.plugins]]
package = "/netlify/plugins/indexnow"
